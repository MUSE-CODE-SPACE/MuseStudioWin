name: Release (cross-platform)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # Linux deferred — webkit2gtk apt deps add 3-4 min and we don't have a
          # download target on the site yet. Re-enable when needed.

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Mac arm64 cross — Tauri docs recommend explicit target.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "MuseStudio ${{ steps.tag.outputs.tag }}"
          releaseBody: |
            ## 이 도구는 무엇인가

            **MuseStudio** 는 [LLM Master (LLMStudy)](https://www.resonance-space.net/llmstudy.html) 의 동반 IDE입니다. 강의 본문에 박혀 있는 Python · JavaScript · Swift · Go · Ruby · Shell 코드 블록을 클릭 한 번에 열어, 그 자리에서 편집 · 실행 · 결과 확인까지 한 앱 안에서 할 수 있게 해줍니다.

            - LLM Agent / AI Engineer 트랙을 학습하는 사람을 위해 만들어졌습니다
            - "강의 → 새 탭 → 코드 옮기기 → 환경 만들기 → 실행" 4단계의 마찰을 0으로 줄이는 게 목적입니다
            - 별도 가입 · 결제 · 데이터 수집 없음. 로컬 실행만

            ## Downloads

            - **Windows**: `_x64-setup.exe` (NSIS) 또는 `_x64_en-US.msi` (MSI)
              - 첫 실행 시 SmartScreen 경고 → "추가 정보" → "실행" 클릭 (코드 사이닝 추후)
            - **macOS Apple Silicon**: `_aarch64.dmg`
              - 첫 실행 시 우클릭 → "열기" 로 Gatekeeper 우회 (공증 추후)

            ## English

            Companion IDE for LLM Master. Open and run any code block from the lesson in one click. Tauri 2.0, no signup, no telemetry.

            Built automatically from commit ${{ github.sha }}.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
