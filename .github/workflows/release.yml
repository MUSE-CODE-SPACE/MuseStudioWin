name: Release (cross-platform)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # Linux deferred — webkit2gtk apt deps add 3-4 min and we don't have a
          # download target on the site yet. Re-enable when needed.

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Mac arm64 cross — Tauri docs recommend explicit target.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "MuseStudio ${{ steps.tag.outputs.tag }}"
          releaseBody: |
            Cross-platform MuseStudio release.

            - Windows: download the `_x64-setup.exe` (NSIS) or `_x64_en-US.msi` (WiX). SmartScreen will warn on first run — click "More info" → "Run anyway" (code-signing cert not yet set up).
            - macOS Apple Silicon: download the `_aarch64.dmg`. Right-click → Open the first time to bypass Gatekeeper (notarization pending).

            Built automatically from commit ${{ github.sha }}.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
