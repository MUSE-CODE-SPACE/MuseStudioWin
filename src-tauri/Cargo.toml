[package]
name = "musestudio-win"
version = "0.2.0"
description = "MuseStudio for Windows — Tauri-based code editor"
authors = ["yoon-k"]
edition = "2021"

[lib]
name = "musestudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
