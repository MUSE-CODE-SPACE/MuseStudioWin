[package]
name = "musestudio-win"
version = "0.3.0"
description = "MuseStudio for Windows — Tauri-based code editor"
authors = ["yoon-k"]
edition = "2021"

[lib]
name = "musestudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
# museedit:// URL scheme 처리. installer (msi/nsis) 가 자동으로 Windows
# registry · macOS Info.plist 등록을 처리. lib.rs 의 plugin init + tauri.conf
# 의 deep-link.desktop.schemes 와 함께 동작.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
